<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Genzic.AI logo">
  <defs>
    <linearGradient id="gz-bg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123d1c"/>
      <stop offset="1" stop-color="#03130a"/>
    </linearGradient>
    <linearGradient id="gz-green" x1="32" y1="10" x2="32" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5dff80"/>
      <stop offset="0.55" stop-color="#13e85a"/>
      <stop offset="1" stop-color="#009a40"/>
    </linearGradient>
    <filter id="gz-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#gz-bg)" stroke="#1c6e33" stroke-width="1.5"/>

  <g filter="url(#gz-glow)" stroke="url(#gz-green)" stroke-linecap="round" fill="none">
    <!-- power-symbol ring with a gap at the top -->
    <path d="M22 22 A 17 17 0 1 1 42 22" stroke-width="3.4"/>
    <!-- power-symbol stem -->
    <line x1="32" y1="13" x2="32" y2="29" stroke-width="3.4"/>
  </g>

  <text x="32" y="45" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-weight="800" font-size="20" letter-spacing="0.5"
        fill="url(#gz-green)" filter="url(#gz-glow)">AI</text>
</svg>
