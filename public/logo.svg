<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" role="img" aria-label="Genzic.AI logo">
  <defs>
    <linearGradient id="silver" x1="256" y1="20" x2="256" y2="492" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fbfbfb"/>
      <stop offset="0.22" stop-color="#dadada"/>
      <stop offset="0.55" stop-color="#a9a9a9"/>
      <stop offset="0.8" stop-color="#cfcfcf"/>
      <stop offset="1" stop-color="#7c7c7c"/>
    </linearGradient>
    <radialGradient id="plate" cx="50%" cy="42%" r="62%">
      <stop offset="0" stop-color="#cfcfcf"/>
      <stop offset="0.7" stop-color="#a6a6a6"/>
      <stop offset="1" stop-color="#7e7e7e"/>
    </radialGradient>
    <linearGradient id="greenMetal" x1="256" y1="150" x2="256" y2="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9bf06a"/>
      <stop offset="0.32" stop-color="#33d04a"/>
      <stop offset="0.7" stop-color="#15a233"/>
      <stop offset="1" stop-color="#0a7322"/>
    </linearGradient>
    <linearGradient id="greenLetters" x1="256" y1="232" x2="256" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#b6f985"/>
      <stop offset="0.5" stop-color="#27c441"/>
      <stop offset="1" stop-color="#0d8a28"/>
    </linearGradient>
    <filter id="emboss" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#03210c" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- chrome / silver frame -->
  <rect x="16" y="16" width="480" height="480" rx="116" fill="url(#silver)"/>
  <rect x="30" y="30" width="452" height="452" rx="104" fill="url(#plate)"/>
  <!-- bevel edges -->
  <rect x="17.5" y="17.5" width="477" height="477" rx="114.5" fill="none" stroke="#ffffff" stroke-opacity="0.85" stroke-width="3"/>
  <rect x="16" y="16" width="480" height="480" rx="116" fill="none" stroke="#5f5f5f" stroke-width="2"/>
  <rect x="30" y="30" width="452" height="452" rx="104" fill="none" stroke="#6b6b6b" stroke-opacity="0.6" stroke-width="2"/>

  <!-- green emblem, embossed onto the plate -->
  <g filter="url(#emboss)">
    <!-- companion lower ring -->
    <path d="M150 366 A150 150 0 0 1 362 366" stroke="url(#greenMetal)" stroke-width="16"
          stroke-linecap="round" fill="none"/>
    <!-- main power ring (gap at top) -->
    <path d="M209.2 176.1 A125 125 0 1 0 302.8 176.1" stroke="url(#greenMetal)" stroke-width="30"
          stroke-linecap="round" fill="none"/>
    <!-- power stem -->
    <rect x="240" y="150" width="32" height="92" rx="16" fill="url(#greenMetal)"/>
    <!-- AI wordmark -->
    <text x="256" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="800" font-size="134" letter-spacing="1" fill="url(#greenLetters)">AI</text>
  </g>

  <!-- glossy top highlights on the green -->
  <g opacity="0.7">
    <path d="M209.2 176.1 A125 125 0 1 0 302.8 176.1" stroke="#e7ffd2" stroke-width="6"
          stroke-linecap="round" fill="none" transform="translate(0 -6)" opacity="0.6"/>
    <rect x="247" y="156" width="9" height="70" rx="4.5" fill="#eaffd6" opacity="0.8"/>
    <text x="256" y="344" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
          font-weight="800" font-size="134" letter-spacing="1" fill="none"
          stroke="#eaffd6" stroke-width="1.6" stroke-opacity="0.7">AI</text>
  </g>
</svg>
